<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async</title>
</head>
<body>
    <h1>Async Concept in JavaScript</h1>
    <button id="stop">Stop</button>
</body>
<script>
    // setTimeout(), clearTimeout()
    const sayKhairul = function(){
        console.log("Khairul");
    }

    const changeText = function() {
        document.querySelector('h1').innerHTML = "best JS repo"
    }


    setTimeout(sayKhairul(), 2000)
    const changeMe = setTimeout(changeText, 2000)

    document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(changeMe)
        console.log(STOPPED);
    })

    clearTimeout()
</script>
</html>
